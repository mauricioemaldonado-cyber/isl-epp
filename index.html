<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPP · ISL — Gestión de Elementos de Protección Personal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --steel:#26333A; --ink:#1B2124; --paper:#F4F2EC; --surface:#FFFFFF;
    --safety:#F2A900; --alert:#C1440E; --line:#DAD6CC; --muted:#8A8478;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  .font-display{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.01em;}
  #app{display:flex;min-height:100vh;}
  aside{width:210px;flex-shrink:0;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;}
  aside .brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.1);}
  aside .brand .title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:var(--safety);line-height:1;}
  aside .brand .sub{font-size:10.5px;color:rgba(255,255,255,.5);margin-top:4px;line-height:1.4;}
  nav{flex:1;padding:10px 0;}
  nav button{width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.75);
    padding:10px 20px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:9px;font-family:inherit;}
  nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
  nav button.active{background:var(--safety);color:var(--ink);font-weight:700;}
  aside .foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.35);line-height:1.5;}
  main{flex:1;padding:26px 32px;overflow-x:auto;min-width:0;}
  h2.section-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;margin:0 0 4px;}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-bottom:2px;}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:2px;}
  .p4{padding:16px;} .p5{padding:20px;} .mb8{margin-bottom:28px;}
  label.field{display:flex;flex-direction:column;gap:4px;}
  label.field span{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;}
  input,select{border:1px solid var(--line);background:#fff;border-radius:2px;padding:8px 10px;font-size:13px;color:var(--ink);
    font-family:inherit;width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--safety);box-shadow:0 0 0 3px rgba(242,169,0,.25);}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;border-radius:2px;border:none;cursor:pointer;
    padding:10px 16px;font-size:13px;font-family:inherit;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-primary{background:var(--ink);color:var(--safety);}
  .btn-primary:hover{background:var(--steel);}
  .btn-accent{background:var(--safety);color:var(--ink);}
  .btn-accent:hover{background:#e0a000;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-danger{background:transparent;color:var(--alert);border:1px solid rgba(193,68,14,.4);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;
    padding:9px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;font-size:13px;border-bottom:1px solid #EEEBE3;}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .kpi{padding:14px;} .kpi .lbl{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;}
  .kpi .val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;}
  .kpi.accent{border:2px solid var(--safety);}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 0;color:var(--muted);font-size:13px;text-align:center;}
  .row-actions button{background:none;border:none;cursor:pointer;color:var(--muted);}
  .row-actions button:hover{color:var(--alert);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}
  .icon-btn:hover{color:var(--ink);}
  .grid-form{display:grid;gap:10px;align-items:end;}
  .item-box{background:#FAF9F5;border:1px solid #EEEBE3;border-radius:2px;padding:12px;margin-bottom:14px;}
  .muted{color:var(--muted);}
  .badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10.5px;font-weight:600;}
  .badge-low{background:rgba(193,68,14,.12);color:var(--alert);}
  #toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:3px;font-size:13px;
    z-index:999;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none;max-width:360px;}
  #toast.error{background:var(--alert);}
  #loading-screen{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;z-index:1000;font-size:13px;color:var(--muted);}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--safety);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:200;}
  .receipt{background:#fff;width:297mm;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);font-family:Arial,Inter,sans-serif;color:var(--ink);}
  .receipt-inner{padding:18px 22px;}
  .receipt table{border-collapse:collapse;}
  .receipt td, .receipt th{border:1px solid var(--ink);}
  .rt-title{text-align:center;font-weight:bold;font-size:14px;text-transform:uppercase;border:1px solid var(--ink);padding:6px;margin-bottom:2px;}
  .rt-small{font-size:9px;text-align:right;margin-bottom:2px;}
  .rt-info td{font-size:10.5px;padding:4px 8px;}
  .rt-grid th{font-size:9.5px;text-transform:uppercase;font-weight:bold;padding:5px;text-align:center;}
  .rt-grid td{font-size:10.5px;padding:4px 6px;height:20px;}
  .modal-actions{position:absolute;top:24px;right:24px;display:flex;gap:8px;}
  @media print{
    .no-print{display:none !important;}
    .modal-bg{position:static;background:#fff;padding:0;}
    .receipt{width:100%;max-height:none;box-shadow:none;overflow:visible;}
    @page{size:landscape;margin:8mm;}
  }
  ::placeholder{color:#B7B2A5;}
</style>
</head>

/* ============================================================ STATE + UTIL */
const state = { tab:"dashboard", data:{}, receipt:null };
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const monthNow = () => new Date().toISOString().slice(0,7);
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const money = (n) => (n||0).toLocaleString("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const numFmt = (n,d=0) => (n||0).toLocaleString("es-AR",{maximumFractionDigits:d});
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = isError ? 'error' : '';
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.style.display='none'; }, isError ? 6000 : 3000);
}

/* Fechas: Sheets devuelve las fechas como "2026-07-29T07:00:00.000Z". Nos quedamos con AAAA-MM-DD / AAAA-MM */
const isoDay = (v) => { const s = String(v ?? ""); return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0,10) : s; };
const isoMonth = (v) => { const s = String(v ?? ""); return /^\d{4}-\d{2}/.test(s) ? s.slice(0,7) : s; };
const fmtFecha = (v) => { const s = isoDay(v); const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? `${m[3]}/${m[2]}/${m[1]}` : s; };
function normalizeDates(data){
  ["Compras","Envios","Entregas"].forEach(n => (data[n]||[]).forEach(r => { r.fecha = isoDay(r.fecha); }));
  (data.HH||[]).forEach(r => { r.mes = isoMonth(r.mes); });
}
async function loadAll(){
  const resp = await fetch(`${APPS_SCRIPT_URL}?action=read`);
  const json = await resp.json();
  if(!resp.ok || !json.ok) throw new Error((json && json.error) || "Error leyendo la planilla");
  normalizeDates(json.data);
  state.data = json.data;
}
async function saveEntity(name, rows){
  const payload = encodeURIComponent(JSON.stringify({sheet:name, rows}));
  const resp = await fetch(`${APPS_SCRIPT_URL}?action=write&payload=${payload}`);
  const json = await resp.json();
  if(!resp.ok || !json.ok) throw new Error((json && json.error) || `Error guardando ${name}`);
  state.data[name] = rows;
}

/* lookups */
const nameOf = (arr, id, field) => (arr.find(x=>x.id===id) || {})[field] || "—";
const artLabel = (a) => a ? [a.denominacion, a.tipoModelo, a.marca].map(s=>String(s??"").trim()).filter(Boolean).join(" · ") : "—";
const nombreArt = (id) => artLabel(state.data.Catalogo.find(a=>a.id===id));
const artSorted = () => [...state.data.Catalogo].sort((a,b)=>artLabel(a).localeCompare(artLabel(b),"es"));
const artOf = (id) => state.data.Catalogo.find(a=>a.id===id);
const nombreObra = (id) => nameOf(state.data.Obras, id, "nombre");
const nombreProv = (id) => nameOf(state.data.Proveedores, id, "nombre");
const nombreEmp = (id) => nameOf(state.data.Personal, id, "nombre");

/* ============================================================ COST ENGINE */
function costoUnitPromedio(){
  const map = {};
  for(const it of state.data.CompraItems){
    if(!map[it.articuloId]) map[it.articuloId] = {qty:0,total:0};
    map[it.articuloId].qty += num(it.cantidad);
    map[it.articuloId].total += num(it.cantidad)*num(it.precioUnitario);
  }
  const out = {};
  Object.keys(map).forEach(k=> out[k] = map[k].qty>0 ? map[k].total/map[k].qty : 0);
  return out;
}
function stockCentral(){
  const s = {};
  for(const it of state.data.CompraItems) s[it.articuloId] = (s[it.articuloId]||0) + num(it.cantidad);
  for(const it of state.data.EnvioItems) s[it.articuloId] = (s[it.articuloId]||0) - num(it.cantidad);
  return s;
}
function stockObra(){
  const s = {};
  for(const it of state.data.EnvioItems){
    const env = state.data.Envios.find(e=>e.id===it.envioId); if(!env) continue;
    s[env.obraId] = s[env.obraId] || {};
    s[env.obraId][it.articuloId] = (s[env.obraId][it.articuloId]||0) + num(it.cantidad);
  }
  for(const it of state.data.EntregaItems){
    const en = state.data.Entregas.find(e=>e.id===it.entregaId); if(!en) continue;
    s[en.obraId] = s[en.obraId] || {};
    s[en.obraId][it.articuloId] = (s[en.obraId][it.articuloId]||0) - num(it.cantidad);
  }
  return s;
}
function itemsOfCompra(compraId){ return state.data.CompraItems.filter(i=>i.compraId===compraId); }
function itemsOfEnvio(envioId){ return state.data.EnvioItems.filter(i=>i.envioId===envioId); }
function itemsOfEntrega(entregaId){ return state.data.EntregaItems.filter(i=>i.entregaId===entregaId); }
function costoEntrega(entregaId, cup){
  return itemsOfEntrega(entregaId).reduce((a,it)=> a + num(it.cantidad)*(cup[it.articuloId]||0), 0);
}
function costoTotalCompras(){
  return state.data.CompraItems.reduce((a,it)=> a + num(it.cantidad)*num(it.precioUnitario), 0);
}

state._reg = state._reg || {emp:"", obra:"", desde:"", hasta:"", orden:"asc"};
function registroRows(){
  const f = state._reg;
  const rows = [];
  state.data.Entregas.forEach((en, idx)=>{
    const emp = state.data.Personal.find(p=>p.id===en.empleadoId) || {};
    itemsOfEntrega(en.id).forEach((it, k)=>{
      rows.push({entregaId:en.id, fecha:en.fecha, ord:idx*1000+k, empleadoId:en.empleadoId, empleado:emp.nombre||"—",
        legajo:emp.legajo||"", obraId:en.obraId, obra:nombreObra(en.obraId), articulo:nombreArt(it.articuloId),
        cantidad:num(it.cantidad), observaciones:en.observaciones||""});
    });
  });
  const dir = f.orden==="desc" ? -1 : 1;
  return rows
    .filter(r=> (!f.emp || r.empleadoId===f.emp) && (!f.obra || r.obraId===f.obra)
             && (!f.desde || r.fecha>=f.desde) && (!f.hasta || r.fecha<=f.hasta))
    .sort((a,b)=> dir*((a.fecha||"").localeCompare(b.fecha||"") || (a.ord-b.ord)));
}
function renderRegistro(){
  const f = state._reg;
  const rows = registroRows();
  const total = rows.reduce((a,r)=>a+r.cantidad,0);
  return `

        <label class="field"><span>Obra</span><select id="rg-obra"><option value="">Todas</option>${state.data.Obras.map(o=>`<option value="${o.id}" ${f.obra===o.id?'selected':''}>${esc(o.nombre)}</option>`).join('')}</select></label>

        <label class="field"><span>Orden</span><select id="rg-orden"><option value="asc" ${f.orden==='asc'?'selected':''}>Más antiguas primero</option><option value="desc" ${f.orden==='desc'?'selected':''}>Más recientes primero</option></select></label>
      </div>
    </div>
    ${rows.length===0 ? emptyState("No hay entregas para los filtros elegidos.") : `
      <div class="card"><table>
        <thead><tr><th>Fecha</th><th>Empleado</th><th>Legajo</th><th>Obra</th><th>Artículo</th><th style="text-align:right;">Cant.</th><th>Observaciones</th><th style="width:36px;"></th></tr></thead>
        <tbody>
        ${rows.map(r=>`<tr>
          <td style="white-space:nowrap;">${esc(fmtFecha(r.fecha))}</td>
          <td style="font-weight:600;">${esc(r.empleado)}</td>
          <td>${esc(r.legajo)}</td>
          <td>${esc(r.obra)}</td>
          <td>${esc(r.articulo)}</td>
          <td style="text-align:right;font-weight:600;">${numFmt(r.cantidad)}</td>
          <td class="muted">${esc(r.observaciones)}</td>
          <td><button class="icon-btn" data-print-reg="${r.entregaId}" title="Imprimir planilla">🖶</button></td></tr>`).join('')}
        <tr style="background:#FAF9F5;"><td colspan="5" style="font-weight:700;">${rows.length} renglón(es)</td><td style="text-align:right;font-weight:700;">${numFmt(total)}</td><td colspan="2"></td></tr>
        </tbody></table></div>`}`;
}
attachHandlers.registro = function(){
  const bind = (id, key) => document.getElementById(id).addEventListener('change', e=>{ state._reg[key]=e.target.value; renderApp(); });
  bind('rg-emp','emp'); bind('rg-obra','obra'); bind('rg-desde','desde'); bind('rg-hasta','hasta'); bind('rg-orden','orden');
  document.querySelectorAll('[data-print-reg]').forEach(el=>el.addEventListener('click', ()=>{ state.receipt = el.dataset.printReg; renderApp(); }));
  document.getElementById('btn-csv-registro').addEventListener('click', ()=>{
    const rows = registroRows();
    const q = (v)=>`"${String(v??"").replace(/"/g,'""')}"`;
    const lines = [["Fecha","Empleado","Legajo","Obra","Artículo","Cantidad","Observaciones"].map(q).join(";")]
      .concat(rows.map(r=>[fmtFecha(r.fecha),r.empleado,r.legajo,r.obra,r.articulo,r.cantidad,r.observaciones].map(q).join(";")));
    const blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `registro-entregas-EPP-${todayISO()}.csv`; a.click(); URL.revokeObjectURL(a.href);
  });
};

/* ============================================================ RECEIPT (Anexo I) */
const TOTAL_FILAS = 18;
function renderReceiptModal(){
  const root = document.getElementById('modal-root');
  const entrega = state.data.Entregas.find(e=>e.id===state.receipt);
  if(!entrega){ root.innerHTML=''; return; }
  const emp = state.data.Personal.find(p=>p.id===entrega.empleadoId) || {};
  const empresa = state.data.Empresa[0] || {};
  const fechaFmt = fmtFecha(entrega.fecha);
  // Todas las entregas del mismo empleado y el mismo día salen en una sola planilla
  const delDia = state.data.Entregas.filter(e=>e.empleadoId===entrega.empleadoId && e.fecha===entrega.fecha);
  let filas = [];
  delDia.forEach(e=> itemsOfEntrega(e.id).forEach(it=> filas.push({art:artOf(it.articuloId), cantidad:it.cantidad})));
  while(filas.length < TOTAL_FILAS) filas.push(null);
  const obrasDia = [...new Set(delDia.map(e=>nombreObra(e.obraId)))].join(' / ');
  const obsDia = delDia.map(e=>e.observaciones).filter(Boolean).join(' — ');

  root.innerHTML = `
    <div class="modal-bg">
      <div class="modal-actions no-print">
        <button class="btn btn-accent" id="btn-print">🖶 Imprimir</button>
        <button class="btn btn-ghost" style="background:#fff;" id="btn-close-receipt">✕ Cerrar</button>
      </div>
      <div class="receipt">
        <div class="receipt-inner">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
            <img src="${LOGO_ISL}" alt="ISL" style="height:30px;">
            <div class="rt-small" style="margin-bottom:0;">Resolución 299/11, Anexo I</div>
          </div>
          <div class="rt-title">Entrega de ropa de trabajo y elementos de protección personal</div>
          <table class="rt-info" style="width:100%;margin-bottom:2px;">
            <tr><td style="width:58%;"><b>Razón Social:</b> ${esc(empresa.razonSocial||'')}</td><td><b>C.U.I.T.:</b> ${esc(empresa.cuit||'—')}</td></tr>
            <tr><td><b>Dirección:</b> ${esc(empresa.direccion||'—')}</td><td><b>Localidad:</b> ${esc(empresa.localidad||'—')} &nbsp;&nbsp;<b>C.P:</b> ${esc(empresa.cp||'—')} &nbsp;&nbsp;<b>Provincia:</b> ${esc(empresa.provincia||'—')}</td></tr>
            <tr><td colspan="2"><b>Nombre y Apellido del Trabajador:</b> ${esc(nombreEmp(entrega.empleadoId))} &nbsp;&nbsp;&nbsp;<b>D.N.I.:</b> ${esc(emp.dni||'—')}</td></tr>
            <tr><td colspan="2"><b>Descripción breve del puesto/s de trabajo:</b> ${esc(emp.puesto||'—')} &nbsp;&nbsp;&nbsp;<b>Obra:</b> ${esc(obrasDia)}</td></tr>
            <tr><td colspan="2" style="font-size:9.5px;font-weight:600;">Elementos de protección personal, necesarios para el trabajador, según el puesto de trabajo:</td></tr>
          </table>
          <table class="rt-grid" style="width:100%;margin-bottom:6px;">
            <thead><tr>
              <th style="width:3%;">N°</th><th style="width:19%;">Producto</th><th style="width:16%;">Tipo // Modelo</th>
              <th style="width:13%;">Marca</th><th style="width:11%;">Posee certificación SI // NO</th>
              <th style="width:7%;">Cantidad</th><th style="width:12%;">Fecha de entrega</th><th style="width:19%;">Firma del trabajador</th>
            </tr></thead>
            <tbody>
              ${filas.map((f,i)=>`<tr>
                <td style="text-align:center;color:var(--muted);">${i+1}</td>
                <td>${f?esc(f.art?.denominacion||''):''}</td>
                <td>${f?esc(f.art?.tipoModelo||''):''}</td>
                <td>${f?esc(f.art?.marca||''):''}</td>
                <td style="text-align:center;">${f?esc(f.art?.certificacion||''):''}</td>
                <td style="text-align:center;font-weight:600;">${f?f.cantidad:''}</td>
                <td style="text-align:center;">${f?fechaFmt:''}</td>
                <td></td></tr>`).join('')}
            </tbody>
          </table>
          <div style="border:1px solid var(--ink);padding:8px;font-size:10px;min-height:42px;">
            <b>Información adicional:</b> ${esc(obsDia)}
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-print').addEventListener('click', ()=>window.print());
  document.getElementById('btn-close-receipt').addEventListener('click', ()=>{ state.receipt=null; renderApp(); });
}

/* ============================================================ HH MENSUALES */
function renderHH(){
  return `
    ${sectionHead("Horas hombre trabajadas","Carga mensual de HH por obra")}
    <div class="card p4 mb8">
      <div class="grid-form" style="grid-template-columns:1fr 160px 160px auto;">
        <label class="field"><span>Obra</span><select id="hh-obra"><option value="">Seleccionar obra…</option>${state.data.Obras.map(o=>`<option value="${o.id}">${esc(o.nombre)}</option>`).join('')}</select></label>
        <label class="field"><span>Mes</span><input type="month" id="hh-mes" value="${monthNow()}"></label>
        <label class="field"><span>HH trabajadas</span><input type="number" min="0" id="hh-horas"></label>
        <button class="btn btn-accent" id="btn-save-hh">💾 Guardar</button>
      </div>
    </div>
    ${state.data.HH.length===0 ? emptyState("Sin registros de HH cargados.") : `
      <div class="card"><table><thead><tr><th>Obra</th><th>Mes</th><th style="text-align:right;">HH trabajadas</th><th style="width:40px;"></th></tr></thead><tbody>
      ${[...state.data.HH].sort((a,b)=>b.mes.localeCompare(a.mes)).map(h=>`<tr><td style="font-weight:600;">${esc(nombreObra(h.obraId))}</td><td>${esc(h.mes)}</td>
        <td style="text-align:right;">${numFmt(num(h.horas))}</td><td class="row-actions"><button data-del-hh="${h.id}">🗑</button></td></tr>`).join('')}
      </tbody></table></div>`}`;
}
attachHandlers.hh = function(){
  document.getElementById('btn-save-hh').addEventListener('click', async ()=>{
    const obraId = document.getElementById('hh-obra').value;
    const mes = document.getElementById('hh-mes').value;
    const horas = document.getElementById('hh-horas').value;
    if(!obraId || !mes || !horas){ toast("Completá obra, mes y horas.", true); return; }
    const existing = state.data.HH.find(h=>h.obraId===obraId && h.mes===mes);
    let rows;
    if(existing) rows = state.data.HH.map(h=> h.id===existing.id ? {...h, horas} : h);
    else rows = [...state.data.HH, {id:uid(), obraId, mes, horas}];
    try{ await saveEntity('HH', rows); toast("HH guardadas."); renderApp(); }
    catch(e){ toast("Error: "+e.message, true); }
  });
  document.querySelectorAll('[data-del-hh]').forEach(el=>el.addEventListener('click', async ()=>{
    try{ await saveEntity('HH', state.data.HH.filter(h=>h.id!==el.dataset.delHh)); renderApp(); }
    catch(e){ toast("Error: "+e.message, true); }
  }));
};

/* ============================================================ REPORTES */
function renderReportes(){
  const cup = costoUnitPromedio();
  const mesFiltro = state._mesFiltro || monthNow();
  const costoPorObra = {};
  for(const en of state.data.Entregas) costoPorObra[en.obraId] = (costoPorObra[en.obraId]||0) + costoEntrega(en.id,cup);
  const costoPorObraMes = {};
  for(const en of state.data.Entregas){
    const mes = (en.fecha||"").slice(0,7);
    costoPorObraMes[en.obraId] = costoPorObraMes[en.obraId] || {};
    costoPorObraMes[en.obraId][mes] = (costoPorObraMes[en.obraId][mes]||0) + costoEntrega(en.id,cup);
  }
  const hhPorObraMes = {};
  for(const h of state.data.HH){ hhPorObraMes[h.obraId] = hhPorObraMes[h.obraId]||{}; hhPorObraMes[h.obraId][h.mes] = num(h.horas); }
  const filas = state.data.Obras.map(o=>{
    const costo = (costoPorObraMes[o.id] && costoPorObraMes[o.id][mesFiltro]) || 0;
    const hh = (hhPorObraMes[o.id] && hhPorObraMes[o.id][mesFiltro]) || 0;
    return {obra:o, costo, hh, costoPorHH: hh>0 ? costo/hh : null};
  });
  const totalCostoMes = filas.reduce((a,f)=>a+f.costo,0);
  const totalHHMes = filas.reduce((a,f)=>a+f.hh,0);
  const costoPorArticulo = {};
  for(const it of state.data.CompraItems) costoPorArticulo[it.articuloId] = (costoPorArticulo[it.articuloId]||0) + num(it.cantidad)*num(it.precioUnitario);
  const artOrdenados = Object.entries(costoPorArticulo).sort((a,b)=>b[1]-a[1]);

  return `
    ${sectionHead("Costos e indicadores","Reportes")}
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="card kpi accent"><div class="lbl">Total comprado (histórico)</div><div class="val">${money(costoTotalCompras())}</div></div>
      <div class="card kpi"><div class="lbl">Total entregado / imputado a obras</div><div class="val">${money(Object.values(costoPorObra).reduce((a,b)=>a+b,0))}</div></div>
      <div class="card kpi"><div class="lbl">Costo empresa — mes seleccionado</div><div class="val">${money(totalCostoMes)}</div></div>
    </div>
    ${sectionHead(null,"Costo por obra y por HH trabajada (mensual)", `<label class="field"><span>Mes</span><input type="month" id="rp-mes" value="${mesFiltro}"></label>`)}
    <div class="card mb8"><table><thead><tr><th>Obra</th><th style="text-align:right;">Costo EPP del mes</th><th style="text-align:right;">HH trabajadas</th><th style="text-align:right;">Costo por HH</th></tr></thead>
      <tbody>
      ${filas.map(f=>`<tr><td style="font-weight:600;">${esc(f.obra.nombre)}</td><td style="text-align:right;">${money(f.costo)}</td>
        <td style="text-align:right;">${f.hh>0?numFmt(f.hh):'—'}</td><td style="text-align:right;font-weight:600;">${f.costoPorHH!=null?money(f.costoPorHH):'—'}</td></tr>`).join('')}
      <tr style="background:#FAF9F5;"><td style="font-weight:700;">TOTAL EMPRESA</td><td style="text-align:right;font-weight:700;">${money(totalCostoMes)}</td>
        <td style="text-align:right;font-weight:700;">${totalHHMes>0?numFmt(totalHHMes):'—'}</td>
        <td style="text-align:right;font-weight:700;">${totalHHMes>0?money(totalCostoMes/totalHHMes):'—'}</td></tr>
      </tbody></table></div>
    ${sectionHead(null,"Costo acumulado por obra (histórico)")}
    ${Object.keys(costoPorObra).length===0 ? emptyState("Sin entregas registradas.") : `
      <div class="card mb8"><table><thead><tr><th>Obra</th><th style="text-align:right;">Costo EPP entregado</th></tr></thead><tbody>
      ${Object.entries(costoPorObra).sort((a,b)=>b[1]-a[1]).map(([oid,c])=>`<tr><td style="font-weight:600;">${esc(nombreObra(oid))}</td><td style="text-align:right;">${money(c)}</td></tr>`).join('')}
      </tbody></table></div>`}
    ${sectionHead(null,"Costo de compra por artículo (histórico)")}
    ${artOrdenados.length===0 ? emptyState("Sin compras registradas.") : `
      <div class="card"><table><thead><tr><th>Artículo</th><th style="text-align:right;">Costo unitario promedio</th><th style="text-align:right;">Total comprado</th></tr></thead><tbody>
      ${artOrdenados.map(([aid,t])=>`<tr><td style="font-weight:600;">${esc(nombreArt(aid))}</td><td style="text-align:right;">${money(cup[aid]||0)}</td><td style="text-align:right;">${money(t)}</td></tr>`).join('')}
      </tbody></table></div>`}`;
}
attachHandlers.reportes = function(){
  document.getElementById('rp-mes').addEventListener('change', (e)=>{ state._mesFiltro = e.target.value; renderApp(); });
};

/* ============================================================ EMPRESA */

  return `
    ${sectionHead("Encabezado de la planilla oficial","Datos de la empresa")}
    <div class="card p5" style="max-width:640px;">
      <div class="muted" style="font-size:12px;margin-bottom:16px;">Estos datos completan el encabezado de la planilla "Entrega de Ropa de Trabajo y EPP" (Resolución SRT 299/11, Anexo I) en cada impresión.</div>

attachHandlers.empresa = function(){
  document.getElementById('btn-save-empresa').addEventListener('click', async ()=>{
    const row = {razonSocial:document.getElementById('emp-razon').value, cuit:document.getElementById('emp-cuit').value,

};

/* ============================================================ INIT */
(async function init(){
  try{
    await loadAll();
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderApp();
  }catch(err){
    document.getElementById('loading-text').textContent = "Error al conectar: " + err.message;
    document.querySelector('.spinner').style.display = 'none';
  }
})();
</script>
